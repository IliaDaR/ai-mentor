name: ai_mentor
description: "AI-Ментор — персональный AI-ассистент для продуктивности"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # HTTP / API
  dio: ^5.4.0

  # JSON
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0

  # Audio
  permission_handler: ^11.3.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Share / Export
  share_plus: ^8.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # Widgets
  home_widget: ^0.5.0

  # Monetization
  in_app_purchase: ^3.1.0
  google_mobile_ads: ^5.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.3.0
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/
